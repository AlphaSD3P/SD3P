    <!-- Firebase SDK 불러오기 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ==========================================
        // [주의] 아래 firebaseConfig 정보를 본인 계정 정보로 꼭 수정하세요!
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyDzq_7krfNpqmOtv2O07m0TZ5kMAqzXBAo",
            authDomain: "sd3p-investing.firebaseapp.com",
            projectId: "sd3p-investing",
            storageBucket: "sd3p-investing.firebasestorage.app",
            messagingSenderId: "387594166935",
            appId: "1:387594166935:web:0a4284d6e192e8611bffd2"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 전역으로 클라우드 함수 노출
        window.cloudDB = { db, doc, getDoc, setDoc };
        window.isCloudLoaded = false;

        // 앱 시작 시 클라우드 데이터 불러오기
        window.loadCloudData(async function() {
            await initAppFromCloud();
        });
    </script>

<body>

<div class="container">
    <div class="header">
        <h1>통합 퉁치기 & 잔고 일별 기록</h1>
        <p>클라우드 실시간 동기화 시스템 (CLOUD REV.1.9)</p>
    </div>

    <div class="tabs" id="tab-buttons"></div>
    <div id="tab-contents"></div>
</div>

<script>
    let strategies = [];
    let allData = {};
    let history = [];
    const chartColors = ['#2b6cb0', '#e53e3e', '#d69e2e', '#38a169', '#805ad5', '#319795', '#dd6b20'];

    // 클라우드에서 데이터 불러오기 함수
    window.loadCloudData = async function(callback) {
        try {
            const docRef = window.cloudDB.doc(window.cloudDB.db, "appData", "stockUserConfig");
            const docSnap = await window.cloudDB.getDoc(docRef);

            if (docSnap.exists()) {
                const cloudVal = docSnap.data();
                strategies = cloudVal.strategies || getDefaultStrategies();
                allData = cloudVal.allData || {};
                history = cloudVal.history || [];
            } else {
                strategies = getDefaultStrategies();
                allData = {};
                history = [];
                await saveCloudDataInstant(); // 최초 기본값 생성
            }
        } catch (e) {
            console.error("클라우드 로드 실패, 로컬 데이터로 대체:", e);
            strategies = JSON.parse(localStorage.getItem('4strat_config_v13')) || getDefaultStrategies();
            allData = JSON.parse(localStorage.getItem('4strat_tungchigi_data_v13')) || {};
            history = JSON.parse(localStorage.getItem('4strat_history_v13')) || [];
        }
        if (callback) callback();
    };

    function getDefaultStrategies() {
        return [
            { id: 'strat1', name: '스위치', defaultMult: 1, defaultCash: 72134.02, defaultShares: 0, defaultAvg: 0, defaultInit: 60000 },
            { id: 'strat2', name: '동파', defaultMult: 6, defaultCash: 68490.00, defaultShares: 90, defaultAvg: 125.87, defaultInit: 60000 },
            { id: 'strat3', name: '3쥐', defaultMult: 6, defaultCash: 49428.00, defaultShares: 12, defaultAvg: 123.31, defaultInit: 60000 },
            { id: 'strat4', name: '펑그마', defaultMult: 1, defaultCash: 5310.41, defaultShares: 1, defaultAvg: 108.89, defaultInit: 5000 },
            { id: 'strat5', name: '방어', defaultMult: 1, defaultCash: 50000.00, defaultShares: 0, defaultAvg: 0, defaultInit: 50000 }
        ];
    }

    // 클라우드에 실시간 저장 함수
    async function saveCloudDataInstant() {
        try {
            await window.cloudDB.setDoc(window.cloudDB.doc(window.cloudDB.db, "appData", "stockUserConfig"), {
                strategies,
                allData,
                history
            });
        } catch (e) {
            console.error("클라우드 저장 실패:", e);
        }
        // 백업용으로 로컬에도 저장
        localStorage.setItem('4strat_config_v13', JSON.stringify(strategies));
        localStorage.setItem('4strat_tungchigi_data_v13', JSON.stringify(allData));
        localStorage.setItem('4strat_history_v13', JSON.stringify(history));
    }

    // 데이터 저장 트리거 (디바운스 적용으로 연속 저장 방지)
    let saveTimeout = null;
    function saveData() {
        collectCurrentUIInputs();
        if (saveTimeout) clearTimeout(saveTimeout);
        saveTimeout = setTimeout(() => {
            saveCloudDataInstant();
        }, 500);
    }

    function collectCurrentUIInputs() {
        strategies.forEach(strat => {
            let dateEl = document.getElementById(`date-${strat.id}`);
            let multEl = document.getElementById(`mult-${strat.id}`);
            if(!dateEl) return;
            let dateVal = dateEl.value;
            let multVal = multEl ? (parseFloat(multEl.value) || 1) : 1;
            
            if(!allData[dateVal]) allData[dateVal] = {};
            allData[dateVal][strat.id] = { mult: multVal, buys: [], sells: [] };

            document.querySelectorAll(`#buy-container-${strat.id} .order-row`).forEach(row => {
                let p = row.querySelector('.buy-price').value;
                let q = row.querySelector('.buy-qty').value;
                allData[dateVal][strat.id].buys.push({ price: p, qty: q });
            });

            document.querySelectorAll(`#sell-container-${strat.id} .order-row`).forEach(row => {
                let p = row.querySelector('.sell-price').value;
                let q = row.querySelector('.sell-qty').value;
                let m = row.querySelector('.sell-moc').checked;
                allData[dateVal][strat.id].sells.push({ price: p, qty: q, isMoc: m });
            });
        });
    }

    async function initAppFromCloud() {
        const tabBtns = document.getElementById('tab-buttons');
        const tabContents = document.getElementById('tab-contents');

        tabBtns.innerHTML = '';
        tabContents.innerHTML = '';

        strategies.forEach((strat, index) => {
            tabBtns.innerHTML += `<button class="tab-btn ${index === 0 ? 'active' : ''}" onclick="switchTab(${index})">${strat.name}</button>`;

            tabContents.innerHTML += `
                <div class="tab-content ${index === 0 ? 'active' : ''}" id="content-${index}">
                    <div class="control-box">
                        <div>
                            <label>📅 기준 날짜</label>
                            <input type="date" id="date-${strat.id}" onchange="onDateOrDataChanged('${strat.id}')" style="width:140px; margin-left:8px;">
                        </div>
                        <div style="display:flex; align-items:center; gap:5px;">
                            <label>⚙️ 수량 배율</label>
                            <input type="number" id="mult-${strat.id}" value="${strat.defaultMult}" min="1" oninput="saveData()" style="width:60px;">
                            <span style="font-size:13px; color:#666; font-weight:bold;">배</span>
                        </div>
                    </div>

                    <div class="section-title title-buy">매수 주문 (LOC) (${strat.name})</div>
                    <div style="display: flex; padding-left: 35px; margin-bottom: 5px; font-size: 12px; color: #888; text-align: center; padding-right: 35px;">
                        <div style="flex: 1;">가격 ($)</div>
                        <div style="flex: 1;">수량</div>
                    </div>
                    <div id="buy-container-${strat.id}"></div>
                    <button class="add-btn" onclick="addRow('${strat.id}', 'buy')">+ 매수 추가</button>

                    <div class="section-title title-sell">매도 주문 (LOC / MOC) (${strat.name})</div>
                    <div style="display: flex; padding-left: 35px; margin-bottom: 5px; font-size: 12px; color: #888; text-align: center; padding-right: 35px;">
                        <div style="flex: 1;">가격 ($)</div>
                        <div style="flex: 1;">수량</div>
                        <div style="width: 30px; margin-left:10px;">MOC</div>
                    </div>
                    <div id="sell-container-${strat.id}"></div>
                    <button class="add-btn" onclick="addRow('${strat.id}', 'sell')">+ 매도 추가</button>
                    
                    <div style="margin-top: 15px;">
                        <button class="execute-btn" onclick="saveStrategyDailyOrders('${strat.id}')" style="background-color:#38a169; padding: 12px; font-size: 14px;">💾 ${strat.name} 현재 날짜 주문 기록 클라우드 저장</button>
                    </div>
                </div>
            `;
        });

        const resIdx = strategies.length;
        const balIdx = strategies.length + 1;
        const setIdx = strategies.length + 2;

        tabBtns.innerHTML += `<button class="tab-btn" onclick="switchTab(${resIdx})" style="color:#e53e3e;">📊 결과보기</button>`;
        tabContents.innerHTML += `
            <div class="tab-content" id="content-${resIdx}">
                <h2 style="font-size:16px; margin-bottom:15px; text-align:center; color:#1a365d;">✨ 동일 날짜 기준 통합 퉁치기</h2>
                <div class="control-box" style="justify-content: center; gap: 15px; margin-bottom: 15px;">
                    <label>조회할 날짜 선택:</label>
                    <input type="date" id="target-calc-date" onchange="calculateTotalNet()" style="width:150px;">
                </div>
                <button class="execute-btn" onclick="calculateTotalNet()" style="margin-bottom: 15px;">선택 날짜 기준 퉁치기 실행</button>
                <div class="result-box" id="final-result-box">
                    <div class="dual-tables-container">
                        <div class="order-column"><div class="column-title title-sell-col">🔵 매도 순주문 (LOC/MOC)</div><div id="sell-result-list"></div></div>
                        <div class="order-column"><div class="column-title title-buy-col">🔴 매수 순주문 (LOC)</div><div id="buy-result-list"></div></div>
                    </div>
                    <div id="cash-needed-display"></div>
                </div>
                <hr style="margin: 25px 0; border:0; border-top:1px solid #eee;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                    <h3 style="font-size:15px; color:#1a365d; margin:0;">📋 기법별 입력된 주문 내역 히스토리</h3>
                    <button onclick="toggleStratHistoryViewMode()" id="strat-history-toggle-btn" style="padding: 5px 10px; font-size:12px; background:#edf2f7; border:1px solid #cbd5e0; border-radius:4px; cursor:pointer;">조회일만 보기 전환</button>
                </div>
                <div id="strat-input-history-container"></div>
            </div>
        `;

        tabBtns.innerHTML += `<button class="tab-btn" onclick="switchTab(${balIdx})" style="color:#2b6cb0;">📈 잔고&일별기록</button>`;
        tabContents.innerHTML += `
            <div class="tab-content" id="content-${balIdx}">
                <div class="control-box" style="justify-content: space-between; margin-bottom: 15px; flex-wrap: wrap;">
                    <div><label>📅 기록 날짜</label><input type="date" id="record-date" onchange="updateBalanceLive()" style="width:130px; margin-left:5px;"></div>
                    <div style="display:flex; gap:15px; align-items:center;">
                        <div><label>💵 당일 종가($)</label><input type="number" step="0.01" id="record-close-price" value="125.87" oninput="updateBalanceLive()" style="width:80px; margin-left:5px;"></div>
                        <div><label>💱 환율(원/달러)</label><input type="number" step="0.01" id="record-exchange-rate" value="1350.00" oninput="updateBalanceLive()" style="width:90px; margin-left:5px;"></div>
                    </div>
                </div>
                <table class="balance-table">
                    <thead>
                        <tr>
                            <th style="width: 12%;">기법명</th><th style="width: 11%;">보유수량</th><th style="width: 12%;">평균가($)</th><th style="width: 15%;">잔여달러($)</th>
                            <th style="width: 15%;">평가총합($)</th><th style="width: 13%;">평가손익($)</th><th style="width: 10%;">수익률</th><th style="width: 12%;">초기자금($)</th>
                        </tr>
                    </thead>
                    <tbody id="balance-tbody"></tbody>
                    <tfoot id="balance-tfoot"></tfoot>
                </table>
                <div id="krw-summary-display"></div>
                <div style="margin-top:15px; display:flex; gap:10px; align-items:center;">
                    <button class="execute-btn" onclick="saveDailyRecord()" style="background-color:#38a169; flex:1; margin-top:0;">💾 일별 잔고 클라우드 기록 저장</button>
                </div>
                <div style="margin-top:8px; font-size:12px; color:#555; display:flex; align-items:center; gap:5px; background:#f0f4f8; padding:8px 12px; border-radius:6px;">
                    <input type="checkbox" id="cascade-update-check" style="width:15px; height:15px; cursor:pointer;">
                    <label for="cascade-update-check" style="cursor:pointer; font-weight:bold; color:#2b6cb0;">과거 날짜 수정 시, 이후 등록된 히스토리도 연쇄 재계산하기</label>
                </div>
                <hr style="margin: 25px 0; border:0; border-top:1px solid #eee;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                    <h3 style="font-size:15px; color:#1a365d; margin:0;">📜 일별 누적 히스토리</h3>
                    <button onclick="toggleBalanceHistoryViewMode()" id="balance-history-toggle-btn" style="padding: 5px 10px; font-size:12px; background:#edf2f7; border:1px solid #cbd5e0; border-radius:4px; cursor:pointer;">조회일만 보기 전환</button>
                </div>
                <div id="history-container"></div>
            </div>
        `;

        tabBtns.innerHTML += `<button class="tab-btn" onclick="switchTab(${setIdx})" style="color:#d69e2e;">⚙️ 기법 관리</button>`;
        tabContents.innerHTML += `
            <div class="tab-content" id="content-${setIdx}">
                <h2 style="font-size:16px; margin-bottom:15px; text-align:center; color:#1a365d;">⚙️ 매매기법 관리</h2>
                <div id="strategy-manage-list"></div>
                <div style="display:flex; gap:10px; margin-top:15px;">
                    <input type="text" id="new-strat-name" placeholder="추가할 새 기법 이름 입력" style="flex:1;">
                    <button class="execute-btn" onclick="addNewStrategy()" style="width:150px; padding:10px; background-color:#38a169;">+ 기법 추가</button>
                </div>
                <button class="execute-btn" onclick="resetAllData()" style="background-color:#e53e3e; margin-top:30px;">전체 초기화</button>
            </div>
        `;

        const today = new Date();
        const todayStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;

        strategies.forEach(strat => {
            let dateInput = document.getElementById(`date-${strat.id}`);
            if(dateInput) dateInput.value = todayStr;
        });
        if(document.getElementById('target-calc-date')) document.getElementById('target-calc-date').value = todayStr;
        if(document.getElementById('record-date')) document.getElementById('record-date').value = todayStr;

        loadDataForDate(null);
        renderStrategyManageList();
        renderBalanceTable();
        renderHistoryList();
    }

    function addRow(stratId, type, price = '', qty = '', isMoc = false) {
        const container = document.getElementById(`${type}-container-${stratId}`);
        if(!container) return;
        const isSell = type === 'sell';
        
        const row = document.createElement('div');
        row.className = 'order-row';
        row.innerHTML = `
            <div class="order-num"></div>
            <div class="input-group">
                <input type="number" step="0.01" class="${type}-price" placeholder="가격" value="${price}" oninput="saveData()">
                <input type="number" class="${type}-qty" placeholder="수량" value="${qty}" oninput="saveData()">
            </div>
            ${isSell ? `<div class="moc-check"><input type="checkbox" class="sell-moc" ${isMoc ? 'checked' : ''} onchange="saveData()"></div>` : ''}
            <button class="delete-btn" onclick="removeRow(this, '${stratId}', '${type}')">×</button>
        `;
        container.appendChild(row);
        updateRowNumbers(stratId, type);
        if(price === '' && qty === '') saveData();

    function loadDataForDate(stratIdTarget) {
        strategies.forEach(strat => {
            if(stratIdTarget && strat.id !== stratIdTarget) return;

            let dateEl = document.getElementById(`date-${strat.id}`);
            let multEl = document.getElementById(`mult-${strat.id}`);
            if(!dateEl) return;
            let dateVal = dateEl.value;

            let buyContainer = document.getElementById(`buy-container-${strat.id}`);
            let sellContainer = document.getElementById(`sell-container-${strat.id}`);
            if(buyContainer) buyContainer.innerHTML = '';
            if(sellContainer) sellContainer.innerHTML = '';

            let dayData = allData[dateVal] && allData[dateVal][strat.id] ? allData[dateVal][strat.id] : null;

            if (dayData) {
                if(multEl && dayData.mult) multEl.value = dayData.mult;
                if(dayData.buys && dayData.buys.length > 0) {
                    dayData.buys.forEach(b => addRow(strat.id, 'buy', b.price, b.qty));
                } else {
                    for(let i=0; i<3; i++) addRow(strat.id, 'buy');
                }
                if(dayData.sells && dayData.sells.length > 0) {
                    dayData.sells.forEach(s => addRow(strat.id, 'sell', s.price, s.qty, s.isMoc));
                } else {
                    for(let i=0; i<3; i++) addRow(strat.id, 'sell');
                }
            } else {
                for(let i=0; i<3; i++) addRow(strat.id, 'buy');
                for(let i=0; i<3; i++) addRow(strat.id, 'sell');
            }
        });
    }

    function calculateTotalNet() {
        let targetDate = document.getElementById('target-calc-date').value;
        let dayData = allData[targetDate] || {};
        let rawBuys = [], rawSells = [], hasValidInput = false;

        strategies.forEach(strat => {
            let stratData = dayData[strat.id];
            if(!stratData) return;
            let mult = stratData.mult || 1;

            if(stratData.buys) {
                stratData.buys.forEach(b => {
                    let price = parseFloat(b.price), qty = parseInt(b.qty);
                    if(!isNaN(price) && !isNaN(qty) && qty > 0) {
                        hasValidInput = true;
                        qty = qty * mult;
                        for(let i=0; i<qty; i++) rawBuys.push(price);
                    }
                });
            }
            if(stratData.sells) {
                stratData.sells.forEach(s => {
                    let price = parseFloat(s.price), qty = parseInt(s.qty), isMoc = s.isMoc;
                    if(!isNaN(qty) && qty > 0) {
                        hasValidInput = true;
                        qty = qty * mult;
                        for(let i=0; i<qty; i++) {
                            if (isMoc) rawSells.push(-1);
                            else if (!isNaN(price)) rawSells.push(price);
                        }
                    }
                });
            }
        });

        const resultBox = document.getElementById('final-result-box');
        const sellList = document.getElementById('sell-result-list');
        const buyList = document.getElementById('buy-result-list');
        const cashDisplay = document.getElementById('cash-needed-display');
        const stratInputHistoryContainer = document.getElementById('strat-input-history-container');

        if (stratInputHistoryContainer) {
            stratInputHistoryContainer.innerHTML = '';
            let allDates = Object.keys(allData).sort((a, b) => new Date(b) - new Date(a));
            if (targetDate && allData[targetDate]) {
                allDates = allDates.filter(d => d !== targetDate);
                allDates.unshift(targetDate);
            }
            if (isStratHistoryAllView && targetDate) allDates = allDates.filter(d => d === targetDate);

            if (allDates.length === 0) {
                stratInputHistoryContainer.innerHTML = '<div class="empty-slot">저장된 주문 기록이 없습니다.</div>';
            } else {
                allDates.forEach(dStr => {
                    let dateData = allData[dStr] || {};
                    let isSelectedCard = (dStr === targetDate);
                    let stratCardsHtml = '';
                    
                    strategies.forEach(strat => {
                        let sData = dateData[strat.id];
                        let mult = sData ? (sData.mult || 1) : 1;
                        let bList = sData && sData.buys ? sData.buys.filter(b => b.price && b.qty) : [];
                        let sList = sData && sData.sells ? sData.sells.filter(s => (s.price || s.isMoc) && s.qty) : [];
                        let buyStr = bList.length > 0 ? `<b>LOC:</b> ` + bList.map(b => `$${b.price} / ${b.qty}주`).join(', ') : '매수 주문 없음';
                        let sellStr = '매도 주문 없음';
                        if (sList.length > 0) {
                            let loc = sList.filter(s => !s.isMoc), moc = sList.filter(s => s.isMoc);
                            let parts = [];
                            if (loc.length) parts.push(`<b>LOC:</b> ` + loc.map(s => `$${s.price} / ${s.qty}주`).join(', '));
                            if (moc.length) parts.push(`<b>MOC:</b> ` + moc.map(s => `${s.qty}주`).join(', '));
                            sellStr = parts.join(' | ');
                        }
                        stratCardsHtml += `<div style="background:#f8f9fa; border:1px solid #edf2f7; border-radius:6px; padding:8px 12px; margin-bottom:6px; font-size:13px;">
                            <div style="font-weight:bold; color:#1a365d; margin-bottom:4px;">📌 ${strat.name} <span style="font-size:11px; color:#666;">(배율: ${mult}배)</span></div>
                            <div style="color:#e53e3e; margin-bottom:2px;">🔴 매수: ${buyStr}</div>
                            <div style="color:#2b6cb0;">🔵 매도: ${sellStr}</div>
                        </div>`;
                    });

                    stratInputHistoryContainer.innerHTML += `
                        <div class="history-card" style="${isSelectedCard ? 'border: 2px solid #2b6cb0; background-color: #f7fafc;' : ''}">
                            <div class="history-header" style="${isSelectedCard ? 'color: #2b6cb0;' : 'color: #4a5568;'}">
                                <span>📅 날짜: ${dStr} ${isSelectedCard ? '<b>(선택된 날짜)</b>' : ''}</span>
                                <button onclick="deleteStratHistoryItem('${dStr}')" style="background:none; border:none; color:#e53e3e; cursor:pointer; font-weight:bold;">삭제</button>
                            </div>
                            <div>${stratCardsHtml}</div>
                        </div>`;
                });
            }
        }

        if (!hasValidInput) { resultBox.style.display = 'none'; return; }

        rawBuys.sort((a, b) => b - a);
        rawSells.sort((a, b) => a - b);
        let netOrders = { 'buy': {}, 'sell': {}, 'moc_sell': 0 };
        function addNet(type, price, qty) {
            if (price === 'MOC') netOrders.moc_sell += qty;
            else netOrders[type][price.toFixed(2)] = (netOrders[type][price.toFixed(2)] || 0) + qty;
        }

        while (rawBuys.length > 0 && rawSells.length > 0) {
            let b = rawBuys[0], s = rawSells[0];
            if (s === -1 || b >= s) {
                rawBuys.shift(); rawSells.shift();
                addNet('sell', b + 0.01, 1);
                if (s !== -1) addNet('buy', s - 0.01, 1);
            } else { break; }
        }

        rawBuys.forEach(b => addNet('buy', b, 1));
        rawSells.forEach(s => s === -1 ? addNet('sell', 'MOC', 1) : addNet('sell', s, 1));

        let sellResults = [];
        for (let p in netOrders.sell) sellResults.push({ price: parseFloat(p), qty: netOrders.sell[p], isMoc: false });
        if (netOrders.moc_sell > 0) sellResults.push({ price: 0, qty: netOrders.moc_sell, isMoc: true });
        sellResults.sort((a, b) => b.price - a.price);

        let buyResults = [];
        for (let p in netOrders.buy) buyResults.push({ price: parseFloat(p), qty: netOrders.buy[p] });
        buyResults.sort((a, b) => b.price - a.price);

        sellList.innerHTML = sellResults.length === 0 ? '<div class="empty-slot">매도 주문 없음</div>' : '';
        sellResults.forEach((item, index) => {
            let bg = index % 2 === 0 ? 'row-white' : 'row-yellow';
            let txt = item.isMoc ? `매도·MOC` : `매도·LOC $${item.price.toFixed(2)}`;
            sellList.innerHTML += `<div class="order-card card-sell ${bg}"><span><span class="dot dot-sell"></span><b>${txt}</b></span><b>${item.qty}주</b></div>`;
        });

        buyList.innerHTML = buyResults.length === 0 ? '<div class="empty-slot">매수 주문 없음</div>' : '';
        buyResults.forEach((item, index) => {
            let bg = index % 2 === 0 ? 'row-white' : 'row-yellow';
            buyList.innerHTML += `<div class="order-card card-buy ${bg}"><span><span class="dot dot-buy"></span><b>매수·LOC $${item.price.toFixed(2)}</b></span><b>${item.qty}주</b></div>`;
        });

        let finalBuyNeedMoney = 0;
        for (let p in netOrders.buy) finalBuyNeedMoney += parseFloat(p) * netOrders.buy[p];

        cashDisplay.innerHTML = `<div class="cash-needed-box">💰 <b>[${targetDate}] 체결 시 필요 예수금</b><br>➔ 약 <b>$${finalBuyNeedMoney.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</b> 필요</div>`;
        resultBox.style.display = 'block';
    }

    function renderBalanceTable() {
        const tbody = document.getElementById('balance-tbody');
        const tfoot = document.getElementById('balance-tfoot');
        const krwDisplay = document.getElementById('krw-summary-display');
        if(!tbody || !tfoot) return;
        
        let recordDate = document.getElementById('record-date').value;
        history.sort((a, b) => new Date(a.date) - new Date(b.date));
        let exactRecord = history.find(h => h.date === recordDate);
        
        let rateInput = document.getElementById('record-exchange-rate');
        let closeInput = document.getElementById('record-close-price');

        if (exactRecord) {
            if (closeInput && closeInput.dataset.lastDate !== recordDate) { closeInput.value = exactRecord.closePrice; closeInput.dataset.lastDate = recordDate; }
            if (rateInput && rateInput.dataset.lastDate !== recordDate) { rateInput.value = exactRecord.exchangeRate || 1350; rateInput.dataset.lastDate = recordDate; }
        }

        let closePrice = parseFloat(closeInput.value) || 0;
        let exchangeRate = parseFloat(rateInput.value) || 0;
        let latestRecord = history.length > 0 ? history[history.length - 1] : null;

        tbody.innerHTML = '';
        let totalShares = 0, totalCash = 0, totalValUSD = 0, totalInit = 0, totalWeightedCost = 0;
        let dayOrders = allData[recordDate] || {};

        strategies.forEach(strat => {
            let base = { shares: 0, avgPrice: 0, cash: 0, initCash: 0 }; 
            if (exactRecord && exactRecord.details && exactRecord.details[strat.id]) {
                let d = exactRecord.details[strat.id];
                base = { shares: d.shares, avgPrice: d.avgPrice, cash: d.cash, initCash: d.initCash };
            } else if (latestRecord && recordDate > latestRecord.date && latestRecord.details && latestRecord.details[strat.id]) {
                let d = latestRecord.details[strat.id];
                base = { shares: d.shares, avgPrice: d.avgPrice, cash: d.cash, initCash: d.initCash };
            }

            let stratDayOrders = dayOrders[strat.id] || null;
            let mult = stratDayOrders ? (stratDayOrders.mult || 1) : (strat.defaultMult || 1);
            let currentShares = Number(base.shares), currentAvg = Number(base.avgPrice), currentCash = Number(base.cash), initCash = Number(base.initCash);

            if (!exactRecord && stratDayOrders) {
                if(stratDayOrders.buys) {
                    stratDayOrders.buys.forEach(b => {
                        let bPrice = parseFloat(b.price), bQty = parseInt(b.qty) * mult;
                        if (!isNaN(bPrice) && !isNaN(bQty) && bQty > 0 && closePrice <= bPrice) {
                            let totalCost = bQty * closePrice;
                            let newTotalShares = currentShares + bQty;
                            if (newTotalShares > 0) currentAvg = ((currentShares * currentAvg) + totalCost) / newTotalShares;
                            currentShares = newTotalShares;
                            currentCash -= totalCost;
                        }
                    });
                }
                if(stratDayOrders.sells) {
                    stratDayOrders.sells.forEach(s => {
                        let sPrice = parseFloat(s.price), sQty = parseInt(s.qty) * mult, isMoc = s.isMoc;
                        if (!isNaN(sQty) && sQty > 0 && (isMoc || (!isNaN(sPrice) && closePrice >= sPrice))) {
                            let executedQty = Math.min(currentShares, sQty);
                            if (executedQty > 0) {
                                currentCash += executedQty * closePrice;
                                currentShares -= executedQty;
                                if (currentShares === 0) currentAvg = 0;
                            }
                        }
                    });
                }
            }

            let evaluationTotal = currentShares > 0 ? (currentShares * closePrice) + currentCash : currentCash;
            let profitUSD = evaluationTotal - initCash;
            let returnRate = initCash > 0 ? (profitUSD / initCash) * 100 : 0;

            totalShares += currentShares; totalCash += currentCash; totalValUSD += evaluationTotal; totalInit += initCash; totalWeightedCost += currentShares * currentAvg;

            tbody.innerHTML += `
                <tr>
                    <td><b>${strat.name}</b></td>
                    <td><input type="number" id="bal-shares-${strat.id}" value="${currentShares}"></td>
                    <td><input type="number" step="0.01" id="bal-avg-${strat.id}" value="${currentAvg.toFixed(2)}"></td>
                    <td><input type="number" step="0.01" id="bal-cash-${strat.id}" value="${currentCash.toFixed(2)}"></td>
                    <td><input type="number" step="0.01" id="bal-val-${strat.id}" value="${evaluationTotal.toFixed(2)}"></td>
                    <td style="color:${profitUSD>=0?'#e53e3e':'#3182ce'}">$${profitUSD.toFixed(2)}</td>
                    <td style="color:${returnRate>=0?'#e53e3e':'#3182ce'}">${returnRate >= 0 ? '▲' : '▼'}${Math.abs(returnRate).toFixed(1)}%</td>
                    <td><input type="number" id="bal-init-${strat.id}" value="${initCash}"></td>
                </tr>`;
        });

        let totProfit = totalValUSD - totalInit, totRet = totalInit > 0 ? (totProfit / totalInit) * 100 : 0;
        let totalAvgPrice = totalShares > 0 ? (totalWeightedCost / totalShares) : 0;
        let totalValKRW = totalValUSD * exchangeRate;

        tfoot.innerHTML = `<tr><td>합계</td><td style="color:#e53e3e;">${totalShares}</td><td>${totalShares > 0 ? '$' + totalAvgPrice.toFixed(2) : '-'}</td><td style="color:#2b6cb0;">$${totalCash.toFixed(2)}</td><td style="color:#1a365d;">$${totalValUSD.toFixed(2)}</td><td style="color:${totProfit>=0?'#e53e3e':'#3182ce'}">$${totProfit.toFixed(2)}</td><td style="color:${totRet>=0?'#e53e3e':'#3182ce'}">${totRet >= 0 ? '▲' : '▼'}${Math.abs(totRet).toFixed(1)}%</td><td>$${totalInit.toFixed(2)}</td></tr>`;

        if (krwDisplay) {
            krwDisplay.innerHTML = `<div class="krw-summary-box"><span>💱 <b>원화 환산액</b> (₩${exchangeRate.toLocaleString()}/$1)</span><b>￦${totalValKRW.toLocaleString('ko-KR', {maximumFractionDigits: 0})}</b></div>`;
        }
    }

    async function saveDailyRecord() {
        let date = document.getElementById('record-date').value;
        let closePrice = parseFloat(document.getElementById('record-close-price').value) || 0;
        let exchangeRate = parseFloat(document.getElementById('record-exchange-rate').value) || 0;
        let details = {}, totalValUSD = 0, totalInit = 0, totalSh = 0;

        strategies.forEach(strat => {
            let shares = parseFloat(document.getElementById(`bal-shares-${strat.id}`).value) || 0;
            let avgPrice = parseFloat(document.getElementById(`bal-avg-${strat.id}`).value) || 0;
            let cash = parseFloat(document.getElementById(`bal-cash-${strat.id}`).value) || 0;
            let valUSD = parseFloat(document.getElementById(`bal-val-${strat.id}`).value) || 0;
            let initCash = parseFloat(document.getElementById(`bal-init-${strat.id}`).value) || 0;
            let profitUSD = valUSD - initCash, returnRate = initCash > 0 ? (profitUSD / initCash) * 100 : 0;

            totalValUSD += valUSD; totalInit += initCash; totalSh += shares;
            details[strat.id] = { name: strat.name, shares, avgPrice, cash, valUSD, initCash, profitUSD, returnRate };
        });

        let totProfit = totalValUSD - totalInit, totRet = totalInit > 0 ? (totProfit / totalInit) * 100 : 0;
        let totalValKRW = totalValUSD * exchangeRate;
        let recordItem = { date, closePrice, exchangeRate, totalSh, totalValUSD, totalValKRW, totProfit, totRet, details };
        
        let existingIndex = history.findIndex(h => h.date === date);
        if (existingIndex >= 0) history[existingIndex] = recordItem;
        else history.push(recordItem);

        history.sort((a, b) => new Date(a.date) - new Date(b.date));
        await saveCloudDataInstant();
        alert(`[${date}] 일별 잔고가 클라우드에 안전하게 저장되었습니다!`);
        renderHistoryList();

    function renderHistoryList() {
        const container = document.getElementById('history-container');
        if(!container) return;
        let recordDate = document.getElementById('record-date') ? document.getElementById('record-date').value : '';
        if (history.length === 0) { container.innerHTML = '<div class="empty-slot">저장된 히스토리가 없습니다.</div>'; return; }

        let sorted = [...history].sort((a, b) => new Date(b.date) - new Date(a.date));
        if (isBalanceHistoryAllView && recordDate) sorted = sorted.filter(h => h.date === recordDate);

        container.innerHTML = '';
        sorted.forEach((item) => {
            let detailHtml = '', idx = 0;
            for (let key in item.details) {
                let d = item.details[key], color = chartColors[idx % chartColors.length];
                let weight = item.totalValUSD > 0 ? ((d.valUSD / item.totalValUSD) * 100).toFixed(1) : 0;
                detailHtml += `<div style="display:flex; align-items:center; margin-bottom:3px; gap:6px;"><span style="width:8px; height:8px; background:${color}; border-radius:50%; display:inline-block;"></span><span><b>${d.name}</b>: ${d.shares}주 (평단:$${d.avgPrice}, 총합:$${d.valUSD}) — 비중 <b>${weight}%</b></span></div>`;
                idx++;
            }
            let isSelected = (item.date === recordDate);
            container.innerHTML += `
                <div class="history-card" style="${isSelected ? 'border: 2px solid #2b6cb0; background-color: #f7fafc;' : ''}">
                    <div class="history-header" style="${isSelected ? 'color: #2b6cb0;' : 'color: #4a5568;'}">
                        <span>📅 ${item.date} (종가: $${item.closePrice} | 환율: ₩${item.exchangeRate || 1350})</span>
                        <button onclick="deleteHistoryItem('${item.date}')" style="background:none; border:none; color:#e53e3e; cursor:pointer; font-weight:bold;">삭제</button>
                    </div>
                    <div class="history-body-grid">
                        <div class="history-info-side">
                            <b>총 수량:</b> ${item.totalSh}주 | <b>평가금액:</b> $${item.totalValUSD.toFixed(2)} (<b>￦${(item.totalValKRW || 0).toLocaleString()}</b>)<br>
                            <b>손익:</b> <span style="color:${item.totProfit>=0?'#e53e3e':'#3182ce'}">$${item.totProfit.toFixed(2)} (${item.totRet >= 0 ? '▲' : '▼'}${Math.abs(item.totRet).toFixed(1)}%)</span>
                            <div style="margin-top:6px; padding-top:6px; border-top:1px dashed #edf2f7;">${detailHtml}</div>
                        </div>
                    </div>
                </div>`;
        });
    }
</script>
</body>
</html>
